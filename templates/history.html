<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #e0f7fa;
        }
        .container {
            max-width: 800px;
            margin-top: 50px;
        }
        .history-table {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .table td {
            word-wrap: break-word;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="history-table">
            <h1 class="text-center mb-4" style="color: #00695c;">URL History</h1>
            
            <table class="table">
                <thead>
                    <tr>
                        <th>Original URL</th>
                        <th>Short URL</th>
                        <th>Created Date</th>
                    </tr>
                </thead>
                <tbody>
                    {% for url in urls %}
                    <tr>
                        <td>{{ url.original_url }}</td>
                        <td>
                            <a href="{{ url.short_url }}" target="_blank">
                                {{ url.short_url }}
                            </a>
                        </td>
                        <td>{{ url.created_date.strftime('%Y-%m-%d %H:%M:%S') }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
            
            <div class="text-center mt-4">
                <a href="{{ url_for('home') }}" class="text-decoration-none" style="color: #00695c;">
                    Back to Shortener
                </a>
            </div>
        </div>
    </div>
</body>
</html>
