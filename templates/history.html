<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL History</title>
    <link rel="icon" href="{{ url_for('static', filename='image2.png') }}" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #e0f7fa;
        }
        .container {
            max-width: 800px;
            margin-top: 50px;
            padding: 0 15px;
        }
        .history-table {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            overflow-x: auto;
        }
        .table {
            width: 100%;
            margin-bottom: 0;
        }
        .table td, .table th {
            word-wrap: break-word;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        @media (max-width: 768px) {
            .container {
                margin-top: 20px;
                padding: 0 10px;
            }
            .history-table {
                padding: 15px;
            }
            h1 {
                font-size: 1.8rem;
            }
            .table td, .table th {
                font-size: 0.9rem;
                max-width: 120px;
            }
        }
        @media (max-width: 576px) {
            .container {
                margin-top: 10px;
            }
            .history-table {
                padding: 12px;
            }
            h1 {
                font-size: 1.5rem;
                margin-bottom: 15px !important;
            }
            .table td, .table th {
                font-size: 0.8rem;
                padding: 8px 4px;
            }
            .url-column {
                max-width: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="history-table">
            <h1 class="text-center mb-4" style="color: #00695c;">URL History</h1>
            
            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th class="url-column">Original URL</th>
                            <th>Short URL</th>
                            <th>Created Date</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for url in urls %}
                        <tr>
                            <td class="url-column" title="{{ url.original_url }}">{{ url.original_url }}</td>
                            <td title="{{ url.short_url }}">
                                <a href="{{ url.short_url }}" target="_blank">
                                    {{ url.short_url }}
                                </a>
                            </td>
                            <td>{{ url.created_date.strftime('%Y-%m-%d %H:%M:%S') }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            
            <div class="text-center mt-4">
                <a href="{{ url_for('home') }}" class="btn btn-outline-primary" style="color: #00695c; border-color: #00695c;">
                    Back to Shortener
                </a>
            </div>
        </div>
    </div>
</body>
</html>
