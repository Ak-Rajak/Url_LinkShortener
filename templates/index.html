<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <link rel="icon" href="{{ url_for('static', filename='image.png') }}" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #e0f7fa;
        }
        .container {
            max-width: 800px;
            margin-top: 50px;
        }
        .url-form {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="url-form">
            <h1 class="text-center mb-4" style="color: #00695c;">URL Shortener</h1>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            
            <form method="POST" class="mb-4">
                <div class="mb-3">
                    <label for="url" class="form-label">Enter URL:</label>
                    <input type="url" class="form-control" id="url" name="url" required>
                </div>
                <button type="submit" class="btn btn-primary w-100" style="background-color: #ff8a65; border: none;">
                    Generate Short URL
                </button>
            </form>
            
            {% if short_url %}
                <div class="mt-4">
                    <label class="form-label">Shortened URL:</label>
                    <div class="input-group">
                        <input type="text" class="form-control" value="{{ short_url }}" id="shortUrl" readonly>
                        <button class="btn btn-success" onclick="copyUrl()" style="background-color: #4db6ac; border: none;">
                            Copy URL
                        </button>
                    </div>
                </div>
            {% endif %}
            
            <div class="text-center mt-4">
                <a href="{{ url_for('history') }}" class="text-decoration-none" style="color: #00695c;">
                    View URL History
                </a>
            </div>
        </div>
    </div>
    
    <script>
        function copyUrl() {
            var copyText = document.getElementById("shortUrl");
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);
            alert("URL copied to clipboard!");
        }
    </script>
</body>
</html>
